{% extends "base.html" %}
{% block title %}Mot de passe oublié — CVBase{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Mot de passe oublié</h1>
    <form method="POST">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" required>
        <button type="submit" class="btn-primary">Envoyer le lien</button>
    </form>
    <p class="muted"><a href="{{ url_for('login') }}">Retour à la connexion</a></p>
</div>
{% endblock %}
