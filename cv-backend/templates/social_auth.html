{% extends "base.html" %}
{% block title %}Connexion {{ provider|capitalize() }} — CVBase{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Continuer avec {{ provider|capitalize() }}</h1>
    <form method="POST">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn-primary">Se connecter</button>
    </form>
    <p class="muted"><a href="{{ url_for('login') }}">Retour à la connexion</a></p>
</div>
{% endblock %}
